<style>
:root{--bg:#f3f0ea;--panel:#fff;--ink:#1d1b18;--mute:#6b665e;--line:#ddd7cc;--acc:#b3261e;--accink:#fff;--shadow:0 8px 24px rgba(0,0,0,.14);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--panel:#181b21;--ink:#ece8e1;--mute:#9a958b;--line:#2a2e36;--acc:#eb4034;--accink:#17130a;--shadow:0 8px 24px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#0f1115;--panel:#181b21;--ink:#ece8e1;--mute:#9a958b;--line:#2a2e36;--acc:#eb4034;--accink:#17130a;--shadow:0 8px 24px rgba(0,0,0,.5)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:1400px;margin:0 auto}
.bar+.bar{margin-top:8px}
.brandbar{justify-content:space-between;flex-wrap:nowrap}.head-actions{display:flex;align-items:center;gap:8px}.icon-btn{width:46px;height:46px;min-width:46px;padding:0;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}.head-actions .icon-btn svg{display:block;width:32px!important;height:32px!important;min-width:32px;min-height:32px}.add-btn{min-width:38px;text-align:center;text-decoration:none;font-size:1.25rem;line-height:1;padding:7px 10px}
h1{font:600 1.5rem/1.1 Georgia,"Times New Roman",serif;margin:0;letter-spacing:-.01em}
.mute{color:var(--mute);font-size:.88rem}.hide{display:none!important}
input,select,button{font:inherit;color:var(--ink)}
input,select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input[type=search]{flex:1 1 200px}
.btn{background:var(--acc);color:var(--accink);border:1px solid var(--acc);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#filters{max-width:1400px;margin:10px auto 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
#filters label{display:flex;flex-direction:column;gap:3px;font-size:.8rem;color:var(--mute)}
#filters .two{display:flex;gap:6px}#filters .two input{width:100%}
#filters #q{flex:none;width:100%;min-width:0;height:auto;min-height:0;padding:8px 10px;line-height:normal;box-sizing:border-box}
main{max-width:1400px;margin:0 auto;padding:16px 14px 40px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 14px}
.card{display:flex;flex-direction:column;gap:3px;min-width:0}
.poster{position:relative;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--panel);border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.12);transition:transform .15s,box-shadow .15s}
.card:hover .poster{transform:translateY(-3px);box-shadow:var(--shadow)}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.noimg{display:grid;place-items:center;height:100%;font:600 2rem Georgia,serif;color:var(--mute)}
.badge{position:absolute;top:6px;right:6px;color:#fff;font-weight:700;font-size:.82rem;border-radius:6px;padding:2px 7px;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.badge.rg{background:#1e7a3c}.badge.ro{background:#b45309}.badge.rr{background:#c62828}
.badge.tmdb{left:6px;right:auto;background:#666;color:#fff}
.poster-date{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 5px;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff;font-size:.72rem;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.7);text-align:left;pointer-events:none}

.card-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;min-width:0}
.card h2{font-size:.95rem;line-height:1.25;margin:0;min-width:0;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{font-size:.8rem;line-height:1.15;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .personal-rating{position:static;flex:none;font-size:.95rem;line-height:1.15;padding:5px 7px;border-radius:8px}
.card .personal-rating small{font-size:.65em;margin-left:1px;opacity:.85}
.card .poster-personal-rating{position:absolute;top:7px;right:7px;left:auto;font-size:1rem;padding:6px 8px;border:1px solid rgba(255,255,255,.28);border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.4);font-weight:800}
.card .poster-personal-rating small{font-size:.62em}
.watched-date{display:flex;align-items:center;gap:6px;margin-top:4px;color:var(--ink);font-size:.82rem;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.watched-date span{color:#eb4034;font-size:1.2rem;font-weight:800;line-height:1}
#q{border-radius:999px;padding:11px 15px;min-height:44px}
.home-controls{flex-wrap:nowrap}
.home-controls #fbtn{white-space:nowrap;display:inline-flex;align-items:center;gap:7px}.home-controls #fbtn .filter-icon{font-size:1.55rem;line-height:.8;font-weight:700}
.home-controls #sort{flex:1;min-width:0;min-height:42px}
.home-controls .sort-direction{min-width:46px;min-height:44px;padding:4px;font-size:1.8rem;font-weight:800;line-height:1}
#status{padding:30px 0;text-align:center;color:var(--mute)}
#more{display:block;margin:26px auto 0}





@media (max-width:520px){
  header{padding:9px 12px}
  h1{font-size:1.28rem}
  .bar+.bar{margin-top:8px}
  #grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 11px}
  main{padding:14px 12px 100px}
  .card{gap:3px}
  .poster{border-radius:10px}
  .card h2{font-size:.91rem}
  .card .meta{font-size:.75rem}
  .watched-date{font-size:.8rem}
}
@media (max-width:360px){
  .home-controls #fbtn{padding:8px 10px;font-size:.9rem}.home-controls #fbtn .filter-icon{font-size:1.5rem}
  .home-controls #sort{font-size:.88rem;padding:8px 7px}
  .card .personal-rating{font-size:.85rem;padding:4px 6px}
}

a.card{color:inherit;text-decoration:none}

.hero{position:relative;margin:0 -14px;padding:26px 14px 18px;background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 62%,transparent),var(--bg) 96%),var(--bd) center top/cover no-repeat}

.dinfo h1{font:600 clamp(1.6rem,4vw,2.5rem)/1.1 Georgia,serif;margin:0 0 4px}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:2px 10px;font-size:.82rem}

.score-pill{flex:none;padding:5px 11px;border:1.5px solid var(--line);border-radius:10px;font-size:1.05rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}

.score-text{display:flex;flex-direction:column;gap:3px;min-width:0}

#detail h2{font:600 1.25rem Georgia,serif;margin:28px 0 10px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}

.strip{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.pcard{position:relative;flex:0 0 110px;font-size:.8rem;color:inherit;text-decoration:none}
.pcard .badge.tmdb{top:6px;left:6px;right:auto}
.pcard img,.pcard .ph{width:110px;aspect-ratio:2/3;object-fit:cover;border-radius:8px;background:var(--panel);border:1px solid var(--line);display:block}

.gal{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}.gal img{height:130px;border-radius:6px;display:block}
details{margin:8px 0}summary{cursor:pointer;color:var(--mute)}


#detail a{color:var(--acc)}#detail a.pcard{color:inherit}

.saga-poster{width:150px;max-width:34vw;aspect-ratio:2/3;object-fit:cover;border-radius:8px;background:var(--panel);box-shadow:var(--shadow)}

.saga-stats{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.saga-grid{display:flex;flex-direction:column;gap:0}
.saga-row{display:grid;grid-template-columns:116px minmax(0,1fr);gap:16px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.saga-row:first-child{padding-top:4px}
.saga-row .saga-cover{position:relative;width:116px;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--panel);border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.12)}

.saga-row .saga-info{min-width:0;padding:2px 0}

#stats{max-width:1100px;margin:0 auto;padding:0 14px 50px}

<body>
<div id="accessGate" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
  <div class="gate-card"><h1 id="gateTitle">Ma vidéothèque</h1>
    <p>Ce site est privé. Saisis le mot de passe pour continuer.</p>
    <form id="accessForm"><input id="accessPassword" type="password" autocomplete="current-password" placeholder="Mot de passe" aria-label="Mot de passe" required autofocus>
      <button class="btn" type="submit">Accéder au site</button><div id="accessError" role="alert"></div>
    </form></div></div>
<script>(()=>{
  let resolveAccess;window.__accessReady=new Promise(resolve=>{resolveAccess=resolve});
  try{if(sessionStorage.getItem('mavideotheque-unlocked')==='1'){document.body.classList.add('unlocked');resolveAccess()}}catch(e){}
  const form=document.getElementById('accessForm'),field=document.getElementById('accessPassword'),error=document.getElementById('accessError');
  const salt='mavideotheque-gate-v1',expected='a97e6deed5a34b21603e85372e5748e2eca73f1439c84c747422c6e4ff4454ee';
  form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';
    try{const data=new TextEncoder().encode(salt+':'+field.value),digest=await crypto.subtle.digest('SHA-256',data);
      const actual=Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,'0')).join('');
      if(actual===expected){try{sessionStorage.setItem('mavideotheque-unlocked','1')}catch(e){}document.body.classList.add('unlocked');resolveAccess();field.value=''}
      else{error.textContent='Mot de passe incorrect.';field.select()}
    }catch(e){error.textContent='Vérification impossible. Utilise un navigateur récent.'}
  });})();</script>
<header>
  <div class="bar brandbar">
    <h1>Ma vidéothèque</h1><div class="head-actions"><a class="btn alt icon-btn" href="#stats" aria-label="Statistiques" title="Statistiques"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5M4 19h17"/><rect x="7" y="11" width="3" height="6" rx=".5"/><rect x="13" y="7" width="3" height="10" rx=".5"/><rect x="19" y="4" width="2" height="13" rx=".5"/></svg></a><a class="btn alt icon-btn" href="tools.html" aria-label="Paramètres et outils" title="Paramètres et outils"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6Z"/><path d="m19.4 13.5 1.1.9-1.6 2.8-1.4-.5a7.8 7.8 0 0 1-1.7 1l-.2 1.5h-3.2l-.3-1.5a7.8 7.8 0 0 1-1.7-1l-1.4.5-1.6-2.8 1.1-.9a7.3 7.3 0 0 1 0-2l-1.1-.9 1.6-2.8 1.4.5a7.8 7.8 0 0 1 1.7-1l.3-1.5h3.2l.2 1.5a7.8 7.8 0 0 1 1.7 1l1.4-.5 1.6 2.8-1.1.9a7.3 7.3 0 0 1 0 2Z"/></svg></a></div>
  </div>
  <div class="bar"><input id="q" type="search" placeholder="Rechercher un film…" aria-label="Filtrer par titre"></div>
  <div class="bar home-controls">
    <button id="fbtn" class="btn alt" type="button" aria-expanded="false"><span class="filter-icon" aria-hidden="true">☷</span>Filtres</button>
    <select id="sort" aria-label="Trier par">
      <option value="w">Tri : Vu le</option><option value="r">Tri : Note</option>
      <option value="t">Tri : Titre</option><option value="m">Tri : Durée</option>
    </select>
    <button id="dirb" class="btn alt sort-direction" type="button" aria-label="Inverser l’ordre du tri">↓</button>
  </div>
  <div id="filters" class="hide">
    <label>Note<span class="two"><input id="rmin" type="number" min="0" max="10" step="0.5" placeholder="min"><input id="rmax" type="number" min="0" max="10" step="0.5" placeholder="max"></span></label>
    <label>Durée (minutes)<span class="two"><input id="mmin" type="number" min="0" placeholder="min"><input id="mmax" type="number" min="0" placeholder="max"></span></label>
    <label>Vu entre<span class="two"><input id="dfrom" type="date"><input id="dto" type="date"></span></label>
    <input id="dsel" type="hidden">
    <label>Genre<select id="gsel"><option value="">Tous</option></select></label>
    <button id="reset" class="btn alt" type="button">Réinitialiser</button>
  </div>
</header>

<main>
  <div id="status">Chargement…</div>
  <div id="grid"></div>
  <button id="more" class="btn alt hide" type="button">Afficher plus</button>
</main>
<section id="detail" class="hide" aria-live="polite"></section>
<section id="stats" class="hide"></section>

<button id="quickAddFab" type="button" aria-label="Ajouter rapidement un film" title="Ajouter rapidement un film">+</button>
<dialog id="quickAddDialog" aria-labelledby="quickAddHeading">
<h2 id="quickAddHeading">Ajouter un film</h2>
<label for="quickAddQuery">Rechercher un film</label>
<div class="quick-search"><input id="quickAddQuery" type="search" placeholder="Titre du film…" autocomplete="off"><button id="quickAddSearch" class="btn" type="button">Rechercher</button></div>
<div id="quickAddResults"></div>
<section id="quickAddSelection" class="hide"><b id="quickAddFilmTitle"></b><div class="quick-fields">
<div class="quick-rating-field"><label>Ma note / 10</label><input id="quickAddRating" type="hidden" value=""><div id="quickAddRatingButtons" class="quick-rating-buttons" role="group" aria-label="Choisir une note sur 10"><button class="quick-rating-btn" type="button" data-rating="1" aria-pressed="false">1</button><button class="quick-rating-btn" type="button" data-rating="2" aria-pressed="false">2</button><button class="quick-rating-btn" type="button" data-rating="3" aria-pressed="false">3</button><button class="quick-rating-btn" type="button" data-rating="4" aria-pressed="false">4</button><button class="quick-rating-btn" type="button" data-rating="5" aria-pressed="false">5</button><button class="quick-rating-btn" type="button" data-rating="6" aria-pressed="false">6</button><button class="quick-rating-btn" type="button" data-rating="7" aria-pressed="false">7</button><button class="quick-rating-btn" type="button" data-rating="8" aria-pressed="false">8</button><button class="quick-rating-btn" type="button" data-rating="9" aria-pressed="false">9</button><button class="quick-rating-btn" type="button" data-rating="10" aria-pressed="false">10</button></div><button id="quickAddNoRating" class="btn alt quick-no-rating" type="button" aria-pressed="true">Sans note</button></div>
<div><label for="quickAddDate">Date de visionnage</label><input id="quickAddDate" type="date" required></div>
</div></section>
<p id="quickAddStatus" role="status" aria-live="polite"></p>
<div class="quick-actions"><button id="quickAddSave" class="btn" type="button" disabled>Enregistrer</button><button id="quickAddClose" class="btn alt" type="button">Fermer</button></div>
</dialog>

<script>
const $=s=>document.querySelector(s);

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
let ALL=[],view=[],shown=120,dir=-1;
const PAGE=120;

/* ---------- affichage ---------- */
const fmtR=r=>r==null?'–':(Number.isInteger(r)?String(r):r.toFixed(1).replace('.',','));
const fmtM=m=>m?`${Math.floor(m/60)} h ${String(m%60).padStart(2,'0')}`:'';
const fmtD=d=>d?new Date(d+'T00:00:00').toLocaleDateString('fr-FR'):'';
const tmdbRatings=new Map(),tmdbPending=new Set();
let ratingObserver;
function card(f){
  const img=f.p?`<img loading="lazy" decoding="async" src="https://image.tmdb.org/t/p/w342${f.p}" alt="">`:`<div class="noimg">${esc((f.t||'?').slice(0,2))}</div>`;
  const rating=tmdbRatings.get(f.id),director=(f.d||[]).join(', ');
  const release=f.y?String(f.y):'';
  return `<a class="card" href="#film/${esc(f.id)}"><div class="poster">${img}
    <span class="badge tmdb${rating==null?' hide':''}" data-tmdb-rating="${esc(f.id)}" title="Note moyenne TMDB">${rating==null?'':fmtR(rating)}</span>
    ${f.r!=null?`<span class="badge personal-rating poster-personal-rating ${f.r>=7?'rg':f.r>=5?'ro':'rr'}" title="Ma note : ${fmtR(f.r)} / 10">${fmtR(f.r)}<small>/10</small></span>`:''}
  </div><div class="card-heading"><h2>${esc(f.t)}</h2></div>
  <div class="meta release-director">${esc([release,director].filter(Boolean).join(' · '))}</div>
  ${f.w?`<div class="watched-date"><span aria-hidden="true">◉</span> Vu le ${fmtD(f.w)}</div>`:''}</a>`;
}
async function loadCardRating(id){
  if(tmdbRatings.has(id)||tmdbPending.has(id))return;
  tmdbPending.add(id);
  try{
    const r=await fetch(`data/films/${encodeURIComponent(id)}.json`,{cache:'no-cache'});
    if(!r.ok)return;
    const f=await r.json(),v=f.tmdb&&f.tmdb.voteAverage;
    if(v!=null&&Number.isFinite(Number(v)))tmdbRatings.set(id,Number(v));
    const el=document.querySelector(`[data-tmdb-rating="${CSS.escape(id)}"]`);
    if(el&&tmdbRatings.has(id)){el.textContent=fmtR(tmdbRatings.get(id));el.classList.remove('hide')}
  }catch(e){/* La note reste absente si la fiche ne peut pas être chargée. */}
  finally{tmdbPending.delete(id)}
}
function observeCardRatings(){
  if(!('IntersectionObserver' in window)){
    document.querySelectorAll('[data-tmdb-rating]').forEach(el=>loadCardRating(el.dataset.tmdbRating));
    return;
  }
  if(ratingObserver)ratingObserver.disconnect();
  ratingObserver=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        ratingObserver.unobserve(entry.target);
        loadCardRating(entry.target.dataset.tmdbRating);
      }
    });
  },{rootMargin:'180px'});
  document.querySelectorAll('[data-tmdb-rating]').forEach(el=>{
    const rating=tmdbRatings.get(el.dataset.tmdbRating);
    if(rating!=null){el.textContent=fmtR(rating);el.classList.remove('hide')}
    else ratingObserver.observe(el);
  });
}
function render(){
  $('#grid').innerHTML=view.slice(0,shown).map(card).join('');
  observeCardRatings();
  $('#more').classList.toggle('hide',shown>=view.length);
  if(ALL.length){
    $('#status').classList.toggle('hide',view.length>0);
    if(!view.length)$('#status').textContent='Aucun film ne correspond à ces filtres.';
  }
}

/* ---------- tri et filtres ---------- */
const keyf={w:f=>f.w,r:f=>f.r,t:f=>f.t,m:f=>f.m};
const num=id=>{const v=$(id).value;return v===''?null:parseFloat(v)};
function apply(){
  const q=norm($('#q').value.trim()),d=norm($('#dsel').value.trim()),g=$('#gsel').value;
  const rmin=num('#rmin'),rmax=num('#rmax'),mmin=num('#mmin'),mmax=num('#mmax'),a=$('#dfrom').value,b=$('#dto').value;
  view=ALL.filter(f=>{
    if(q&&!norm(f.t).includes(q))return false;
    if(d&&!(f.d||[]).some(x=>norm(x).includes(d)))return false;
    if(g&&!(f.g||[]).includes(g))return false;
    if(rmin!=null&&(f.r==null||f.r<rmin))return false;
    if(rmax!=null&&(f.r==null||f.r>rmax))return false;
    if(mmin!=null&&(!f.m||f.m<mmin))return false;
    if(mmax!=null&&(!f.m||f.m>mmax))return false;
    if(a&&(!f.w||f.w<a))return false;
    if(b&&(!f.w||f.w>b))return false;
    return true;
  });
  const k=keyf[$('#sort').value];
  view.sort((x,y)=>{
    const u=k(x),v=k(y),nu=u==null||u==='',nv=v==null||v==='';
    if(nu&&nv)return 0;if(nu)return 1;if(nv)return -1;
    return (typeof u==='string'?u.localeCompare(v,'fr',{sensitivity:'base'}):u-v)*dir;
  });
  shown=PAGE;render();
}
let tm;const deb=()=>{clearTimeout(tm);tm=setTimeout(apply,150)};
document.querySelectorAll('header input,header select').forEach(el=>el.addEventListener('input',deb));
$('#sort').addEventListener('change',()=>{dir=$('#sort').value==='t'?1:-1;$('#dirb').textContent=dir<0?'↓':'↑';apply()});
$('#dirb').onclick=()=>{dir=-dir;$('#dirb').textContent=dir<0?'↓':'↑';apply()};
$('#fbtn').onclick=()=>{const h=$('#filters').classList.toggle('hide');$('#fbtn').setAttribute('aria-expanded',String(!h))};
$('#reset').onclick=()=>{document.querySelectorAll('#filters input,#filters select,#q').forEach(e=>e.value='');apply()};
$('#more').onclick=()=>{shown+=PAGE;render()};

function build(films){
  ALL=films;
  const gs=[...new Set(ALL.flatMap(f=>f.g||[]))].sort((a,b)=>a.localeCompare(b,'fr')),cur=$('#gsel').value;
  $('#gsel').innerHTML='<option value="">Tous</option>'+gs.map(x=>`<option>${esc(x)}</option>`).join('');
  $('#gsel').value=cur;
  if(!ALL.length){$('#status').classList.remove('hide');$('#status').textContent='Aucun film pour l’instant.'}
  apply();
}

/* ---------- page de détail ---------- */
const IMG='https://image.tmdb.org/t/p/';
const fmtLong=d=>d?new Date(d+'T00:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}):'';
const money=n=>n?new Intl.NumberFormat('fr-FR',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n):'';
const rcls=r=>r>=7?'rg':r>=5?'ro':'rr';
const names=a=>(a||[]).filter(Boolean).map(esc).join(', ');
let gridScroll=0;
function pcard(href,img,title,sub,ext,badge,rating){
  return `<a class="pcard" href="${esc(href)}"${ext?' target="_blank" rel="noopener"':''}>${img?`<img loading="lazy" src="${img}" alt="">`:`<div class="ph noimg">${esc((title||'?').slice(0,2))}</div>`}${rating!=null?`<span class="badge tmdb" title="Note moyenne TMDB">${fmtR(Number(rating))}</span>`:''}<b>${esc(title)}</b>${sub?`<span>${esc(sub)}</span>`:''}${badge?'<span class="inlib">Dans ma vidéothèque</span>':''}</a>`;
}
function detailHTML(f){
  const t=f.tmdb||{},x=f.extra||{},c=f.csv||{},lib=new Set(ALL.map(a=>a.id));
  const title=t.title||c.title,rate=c.rating;
  const cast=(x.credits&&x.credits.cast&&x.credits.cast.length)?x.credits.cast:(t.cast||[]).map(a=>({id:a.id,name:a.name,character:a.character,profile_path:a.profilePath}));
  const kv=(k,v)=>v?`<dt>${k}</dt><dd>${v}</dd>`:'';
  const money1=[t.budget?`Budget : ${money(t.budget)}`:'',t.revenue?`Recettes : ${money(t.revenue)}`:''].filter(Boolean).join(' · ');
  const seen=new Set([t.tmdbId]),sim=[];
  [...(x.recommendations||[]),...(x.similar||[])].forEach(m=>{if(!seen.has(m.id)){seen.add(m.id);sim.push(m)}});
  const crew=(x.credits&&x.credits.crew)||[];
  const crewNames=a=>(a||[]).filter(Boolean).map(name=>{const person=crew.find(p=>p.name===name&&p.id!=null);return person?`<a href="https://www.themoviedb.org/person/${encodeURIComponent(person.id)}" target="_blank" rel="noopener noreferrer">${esc(name)}</a>`:esc(name)}).join(', ');
  const crewBy={};crew.forEach(p=>{(crewBy[p.department]=crewBy[p.department]||new Map()).set(p.job,[...(crewBy[p.department].get(p.job)||[]),p.name])});
  const bd=t.backdropPath?`style="--bd:url(${IMG}w1280${t.backdropPath})"`:'';
  const fmtV=n=>Number(n).toLocaleString('fr-FR');
  const scoreHTML=(()=>{
    const cal='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>';
    const mine=(rate!=null||c.watchedDate)?`<div class="score">${rate!=null?`<span class="score-badge ${rcls(rate)}" title="Ma note : ${fmtR(rate)} sur 10">${fmtR(rate)}<small>/10</small></span>`:''}<div class="score-text"><span class="score-label">${rate!=null?'Ma note':'Mon visionnage'}</span>${c.watchedDate?`<span class="score-sub">${cal}Vu le ${fmtD(c.watchedDate)}</span>`:''}</div></div>`:'';
    const avg=Number(t.voteAverage),n=Number(t.voteCount);
    const tmdb=avg>0?`<div class="score"><span class="score-pill" title="Note moyenne TMDB : ${fmtR(avg)} sur 10">${fmtR(avg)}<small>/10</small></span><div class="score-text"><span class="score-label">TMDB</span>${n>0?`<span class="score-sub">${fmtV(n)} vote${n>1?'s':''}</span>`:''}</div></div>`:'';
    return mine||tmdb?`<div class="scorebox" role="group" aria-label="Notes et visionnage">${mine}${tmdb}</div>`:'';
  })();
  return `<div class="topbar"><button class="btn alt" id="back" type="button">← Ma vidéothèque</button><a class="btn alt" href="tools.html?edit=${encodeURIComponent(f.id)}">Modifier</a></div>
  <div class="hero" ${bd}><div class="hero-in">
    ${t.posterPath?`<img class="dposter" src="${IMG}w500${t.posterPath}" alt="Affiche de ${esc(title)}">`:''}
    <div class='dinfo'><h1>${esc(title)}</h1>${t.tmdbId?`<p class='mute'><a href='https://www.themoviedb.org/movie/${encodeURIComponent(t.tmdbId)}' target='_blank' rel='noopener noreferrer'>Voir la fiche du film sur TMDB</a></p><p class='mute'><a href='https://www.senscritique.com/search?query=${encodeURIComponent([title,t.releaseDate&&t.releaseDate.slice(0,4)].filter(Boolean).join(' '))}' target='_blank' rel='noopener noreferrer'>Rechercher ce film sur SensCritique</a></p>`:""}
      ${t.originalTitle&&t.originalTitle!==title?`<p class="orig">${esc(t.originalTitle)}</p>`:''}
      ${t.tagline?`<p class="tag">${esc(t.tagline)}</p>`:''}
      <div class="chips">${[t.releaseDate&&t.releaseDate.slice(0,4),fmtM(t.runtime),t.certificationFR].filter(Boolean).map(v=>`<span class="chip">${esc(v)}</span>`).join('')}${(t.genres||[]).map((g,i)=>{const id=(t.genreIds||[])[i];return id?`<a class='chip' href='https://www.themoviedb.org/genre/${encodeURIComponent(id)}-${norm(g).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}/movie' target='_blank' rel='noopener noreferrer' title='Voir les films de ce genre sur TMDB'>${esc(g)}</a>`:`<span class='chip'>${esc(g)}</span>`}).join("")}</div>
      ${scoreHTML}
      </div></div></div>
  ${t.overview?`<h2>Synopsis</h2><p>${esc(t.overview)}</p>${t.overviewLang==='en'?'<p class="mute">Synopsis non disponible en français.</p>':''}`:''}
  <div class="cols"><div><h2>Équipe</h2><dl class="kv">${kv('Réalisation',crewNames(t.directors))}${kv('Scénario',crewNames(t.writers))}${kv('Musique',crewNames(t.composers))}${kv('Photographie',crewNames(t.cinematographers))}${kv('Montage',crewNames(t.editors))}${kv('Production',crewNames(t.producers))}</dl></div>
  <div><h2>Informations</h2><dl class="kv">${kv('Sortie',fmtLong(t.releaseDate))}${kv('Pays',names(t.countries))}${kv('Langues',names(t.languages))}${kv('Studios',names((t.companies||[]).slice(0,6)))}${kv('Saga',(t.collection||{}).id?'<a href="#saga/'+encodeURIComponent(t.collection.id)+'">'+esc((t.collection||{}).name||'Voir la saga')+'</a>':esc((t.collection||{}).name||''))}${kv('Chiffres',esc(money1))}</dl></div></div>
  ${cast.length?`<h2>Distribution</h2><div class="strip">${cast.slice(0,20).map(a=>pcard('https://www.themoviedb.org/person/'+a.id,a.profile_path?IMG+'w185'+a.profile_path:null,a.name,a.character,true)).join('')}</div>
    ${cast.length>20?`<details><summary>Distribution complète (${cast.length})</summary>${cast.map(a=>`<span>${a.id!=null?`<a href='https://www.themoviedb.org/person/${encodeURIComponent(a.id)}' target='_blank' rel='noopener noreferrer'>${esc(a.name)}</a>`:esc(a.name)}${a.character?` <span class='mute'>(${esc(a.character)})</span>`:""}</span>`).join("<br>")}</details>`:""}`:""}
  ${Object.keys(crewBy).length?`<details><summary>Équipe technique complète</summary>${Object.keys(crewBy).sort().map(d=>`<p><b>${esc(d)}</b><br>${[...crewBy[d]].map(([j,n])=>`<span class="mute">${esc(j)} :</span> ${crewNames([...new Set(n)])}`).join('<br>')}</p>`).join('')}</details>`:''}
  ${sim.length?`<h2>Dans le même esprit</h2><div class="strip">${sim.slice(0,18).map(m=>{const id='t'+m.id,inl=lib.has(id);return pcard(inl?'#film/'+id:'https://www.themoviedb.org/movie/'+m.id,m.poster_path?IMG+'w185'+m.poster_path:null,m.title,(m.release_date||'').slice(0,4),!inl,inl,m.vote_average)}).join('')}</div>`:''}
  ${(t.keywords||[]).length?`<h2>Mots-clés</h2><div class="chips">${t.keywords.map(k=>{const kw=(x.keywords||[]).find(q=>q.name===k&&q.id);return kw?`<a class="chip" href="https://www.themoviedb.org/keyword/${encodeURIComponent(kw.id)}" target="_blank" rel="noopener noreferrer" title="Voir les films associés sur TMDB">${esc(k)}</a>`:`<span class="chip">${esc(k)}</span>`}).join('')}</div>`:''}
  ${((x.images||{}).backdrops||[]).length?`<h2>Images</h2><div class="gal">${x.images.backdrops.slice(0,12).map(i=>`<a href="${IMG}original${i.file_path}" target="_blank" rel="noopener"><img loading="lazy" src="${IMG}w300${i.file_path}" alt=""></a>`).join('')}</div>`:''}
`;
}
async function showDetail(id){
  const el=$('#detail');el.classList.remove('hide');
  el.innerHTML='<div class="topbar"><button class="btn alt" id="back" type="button">← Ma vidéothèque</button></div><p class="mute">Chargement…</p>';
  try{
    const r=await fetch(`data/films/${encodeURIComponent(id)}.json?v=${Date.now()}`,{cache:'no-store'});
    if(!r.ok)throw new Error('fiche introuvable (HTTP '+r.status+')');
    const f=await r.json();
    if(location.hash!=='#film/'+id)return;
    el.innerHTML=detailHTML(f);
    document.title=((f.tmdb&&f.tmdb.title)||(f.csv&&f.csv.title)||'Film')+' · Ma vidéothèque';
  }catch(e){el.innerHTML='<div class="topbar"><button class="btn alt" id="back" type="button">← Ma vidéothèque</button></div><p class="mute">Impossible d’afficher ce film : '+esc(e.message)+'</p>'}
}

async function showSaga(id){
 const el=$('#detail');el.classList.remove('hide');
 el.innerHTML='<div class="topbar"><button class="btn alt" id="back" type="button">← Ma vidéothèque</button></div><p class="mute">Chargement de la saga…</p>';
 try{
  if(!/^\d+$/.test(String(id)))throw new Error('Identifiant de saga invalide.');
  const r=await fetch('data/sagas/'+encodeURIComponent(id)+'.json',{cache:'no-cache'});
  if(!r.ok)throw new Error(r.status===404?'Les informations de cette saga (ID TMDB '+id+') ne sont pas encore enregistrées.':'fiche de saga introuvable (HTTP '+r.status+')');
  const saga=await r.json();
  if(location.hash!=='#saga/'+id)return;
  const parts=[...(saga.parts||[])].sort((a,b)=>(a.release_date||'9999').localeCompare(b.release_date||'9999'));
  const matches=parts.map(m=>{
   const exact='t'+m.id,film=ALL.find(a=>a.id===exact)||ALL.find(a=>a.id.startsWith(exact+'-')||a.id.startsWith(exact+'_'));
   return {m,film};
  });
  const watched=matches.filter(x=>x.film&&x.film.w).length,inLibrary=matches.filter(x=>x.film).length;
  const bd=saga.backdrop_path?'style="--bd:url('+IMG+'w1280'+saga.backdrop_path+')"':'';

function h53(str){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)}

async function quickGh(path,options={}){const r=await fetch(QUICK_GH+path,{...options,headers:{Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',Authorization:'Bearer '+quickGithub,...(options.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.message||'Erreur GitHub '+r.status+'.');return d}
async function quickCommit(files){const ref=await quickGh('/git/ref/heads/main'),parentSha=ref.object.sha,parent=await quickGh('/git/commits/'+parentSha),blobs=await Promise.all(files.map(async f=>{const b=await quickGh('/git/blobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:f.content,encoding:'utf-8'})});return {path:f.name,mode:'100644',type:'blob',sha:b.sha}})),tree=await quickGh('/git/trees',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({base_tree:parent.tree.sha,tree:blobs})}),commit=await quickGh('/git/commits',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'Ajout rapide d’un film',tree:tree.sha,parents:[parentSha]})});await quickGh('/git/refs/heads/main',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({sha:commit.sha,force:false})});return commit}
async function quickSave(){if(quickBusy||!quickMovie)return;const raw=$('#quickAddRating').value,rating=raw===''?null:Number(raw),date=$('#quickAddDate').value;if(rating!==null&&(!Number.isInteger(rating)||rating<1||rating>10)){quickStatus('La note doit être un nombre entier entre 1 et 10.','bad');return}if(!date){quickStatus('Indique une date de visionnage.','bad');return}quickBusy=true;$('#quickAddSave').disabled=true;$('#quickAddClose').disabled=true;quickStatus('Lecture de l’index GitHub…');try{const response=await quickGh('/contents/data/index.json?ref=main'),base=JSON.parse(quickDecode64(response.content));if(!Array.isArray(base.films))throw Error('Index GitHub invalide.');const id='t'+quickMovie.id,year=Number((quickMovie.release_date||'').slice(0,4))||null,title=quickMovie.title||quickMovie.original_title;if(base.films.some(f=>f.id===id))throw Error('Ce film est déjà présent dans ta vidéothèque.');const normTitle=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();if(base.films.some(f=>normTitle(f.t)===normTitle(title)&&(f.y||null)===year))throw Error('Un film avec le même titre et la même année est déjà présent.');const csv={title,year,directors:[...new Set(((quickMovie.credits||{}).crew||[]).filter(x=>x.job==='Director').map(x=>x.name))],rating,watchedDate:date},tmdb=shape(quickMovie),extraData=fitExtra(buildExtra(quickMovie)),key=normTitle(title)+'|'+(year||''),record={id,key,csv,status:'ok',tmdb,extra:extraData},rawRecord=JSON.stringify(record),h=h53(rawRecord),idx={id,t:title,o:tmdb.originalTitle||null,y:year,d:tmdb.directors.length?tmdb.directors:csv.directors,r:rating,w:date,m:tmdb.runtime||null,g:tmdb.genres||[],p:tmdb.posterPath||null,s:'ok',h,c:tmdb.collection?tmdb.collection.id:null,cn:tmdb.collection?tmdb.collection.name:null},files=[{name:'data/films/'+id+'.json',content:rawRecord}];if(quickMovie.belongs_to_collection?.id){quickStatus('Récupération des informations de saga…');const saga=await quickTmdbApi('/collection/'+quickMovie.belongs_to_collection.id,{language:'fr-FR'});if(!Array.isArray(saga.parts))throw Error('Impossible de récupérer les informations de la saga. Aucun ajout effectué.');files.push({name:'data/sagas/'+saga.id+'.json',content:JSON.stringify({...saga,fetchedAt:new Date().toISOString()})})}const films=[...base.films,idx].sort((a,b)=>a.id<b.id?-1:a.id>b.id?1:0);files.unshift({name:'data/index.json',content:JSON.stringify({...base,count:films.length,generatedAt:new Date().toISOString(),films})});quickStatus('Enregistrement sur GitHub…');const commit=await quickCommit(files);quickStatus('Film ajouté avec succès (commit '+commit.sha.slice(0,7)+').','good');$('#quickAddSave').textContent='Ajouté';$('#quickAddSave').disabled=true;$('#quickAddResults').innerHTML='';$('#quickAddSelection').classList.add('hide')}catch(e){let m=e.message||String(e);if(/Bad credentials/i.test(m))m='Jeton GitHub invalide ou expiré.';else if(/Resource not accessible by personal access token/i.test(m))m='Le jeton GitHub doit autoriser Contents : Read and write.';quickStatus('Échec de l’ajout : '+m,'bad');$('#quickAddSave').disabled=false}finally{quickBusy=false;$('#quickAddClose').disabled=false}}
$('#quickAddRatingButtons').addEventListener('click',e=>{const b=e.target.closest('[data-rating]');if(b)quickSetRating(b.dataset.rating)});$('#quickAddNoRating').addEventListener('click',()=>quickSetRating(''));$('#quickAddFab').addEventListener('click',quickOpen);$('#quickAddSearch').addEventListener('click',quickSearch);$('#quickAddQuery').addEventListener('keydown',e=>{if(e.key==='Enter')quickSearch()});$('#quickAddSave').addEventListener('click',quickSave);$('#quickAddClose').addEventListener('click',()=>$('#quickAddDialog').close());$('#quickAddDialog').addEventListener('close',()=>{quickMovie=null;$('#quickAddSave').textContent='Enregistrer';$('#quickAddSave').disabled=true});quickTokenState();window.addEventListener('storage',quickTokenState);window.__accessReady.then(quickTokenState);
