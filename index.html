<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https://image.tmdb.org; connect-src 'self' https://api.themoviedb.org; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; base-uri 'self'; object-src 'none'; form-action 'self'">
<meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet">
<title>Accueil</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%9E%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f3f0ea;--panel:#fff;--ink:#1d1b18;--mute:#6b665e;--line:#ddd7cc;--acc:#b3261e;--accink:#fff;--shadow:0 8px 24px rgba(0,0,0,.14);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--panel:#181b21;--ink:#ece8e1;--mute:#9a958b;--line:#2a2e36;--acc:#eb4034;--accink:#17130a;--shadow:0 8px 24px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#0f1115;--panel:#181b21;--ink:#ece8e1;--mute:#9a958b;--line:#2a2e36;--acc:#eb4034;--accink:#17130a;--shadow:0 8px 24px rgba(0,0,0,.5)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:1400px;margin:0 auto}
.bar+.bar{margin-top:8px}
.add-btn{min-width:38px;text-align:center;text-decoration:none;font-size:1.25rem;line-height:1;padding:7px 10px}
h1{font:600 1.5rem/1.1 Georgia,"Times New Roman",serif;margin:0;letter-spacing:-.01em}
.mute{color:var(--mute);font-size:.88rem}.hide{display:none!important}
input,select,button{font:inherit;color:var(--ink)}
input,select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input[type=search]{flex:1 1 200px}
.btn{background:var(--acc);color:var(--accink);border:1px solid var(--acc);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#filters{max-width:1400px;margin:10px auto 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
#filters label{display:flex;flex-direction:column;gap:3px;font-size:.8rem;color:var(--mute)}
#filters .two{display:flex;gap:6px}#filters .two input{width:100%}
#filters #q{flex:none;width:100%;min-width:0;height:auto;min-height:0;padding:8px 10px;line-height:normal;box-sizing:border-box}
main{max-width:1400px;margin:0 auto;padding:16px 14px 40px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 14px}
.card{display:flex;flex-direction:column;gap:3px;min-width:0}
.poster{position:relative;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--panel);border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.12);transition:transform .15s,box-shadow .15s}
.card:hover .poster{transform:translateY(-3px);box-shadow:var(--shadow)}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.noimg{display:grid;place-items:center;height:100%;font:600 2rem Georgia,serif;color:var(--mute)}
.badge{position:absolute;top:6px;right:6px;color:#fff;font-weight:700;font-size:.82rem;border-radius:6px;padding:2px 7px;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.badge.rg{background:#1e7a3c}.badge.ro{background:#b45309}.badge.rr{background:#c62828}
.badge.tmdb{left:6px;right:auto;background:#666;color:#fff}.badge.kodi-badge{top:auto;right:6px;bottom:6px;left:auto;width:29px;height:27px;padding:4px 5px;background:rgba(20,24,30,.88);border:1px solid rgba(255,255,255,.55);display:grid;place-items:center}.badge.kodi-badge svg{width:18px;height:18px;display:block}
.poster-date{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 5px;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff;font-size:.72rem;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.7);text-align:left;pointer-events:none}

.card-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;min-width:0}
.card h2{font-size:.95rem;line-height:1.25;margin:0;min-width:0;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{font-size:.8rem;line-height:1.15;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .personal-rating{position:static;flex:none;font-size:.95rem;line-height:1.15;padding:5px 7px;border-radius:8px}
.card .personal-rating small{font-size:.65em;margin-left:1px;opacity:.85}
.card .poster-personal-rating{position:absolute;top:7px;right:7px;left:auto;font-size:1rem;padding:6px 8px;border:1px solid rgba(255,255,255,.28);border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.4);font-weight:800}
.card .poster-personal-rating small{font-size:.62em}
.watched-date{display:flex;align-items:center;gap:6px;margin-top:4px;color:var(--ink);font-size:.82rem;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.watched-date span{color:#eb4034;font-size:1.2rem;font-weight:800;line-height:1}
#q{border-radius:999px;padding:11px 15px;min-height:44px}
.home-controls{flex-wrap:nowrap}
.home-controls #fbtn{white-space:nowrap;display:inline-flex;align-items:center;gap:7px}.home-controls #fbtn .filter-icon{font-size:1.55rem;line-height:.8;font-weight:700}
.home-controls #sort{flex:1;min-width:0;min-height:42px}
.home-controls .sort-direction{min-width:46px;min-height:44px;padding:4px;font-size:1.8rem;font-weight:800;line-height:1}
#status{padding:30px 0;text-align:center;color:var(--mute)}
#more{display:block;margin:26px auto 0}





@media (max-width:520px){
  header{padding:9px 12px}
  h1{font-size:1.28rem}
  .bar+.bar{margin-top:8px}
  #grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 11px}
  main{padding:14px 12px 100px}
  .card{gap:3px}
  .poster{border-radius:10px}
  .card h2{font-size:.91rem}
  .card .meta{font-size:.75rem}
  .watched-date{font-size:.8rem}
}
@media (max-width:360px){
  .home-controls #fbtn{padding:8px 10px;font-size:.9rem}.home-controls #fbtn .filter-icon{font-size:1.5rem}
  .home-controls #sort{font-size:.88rem;padding:8px 7px}
  .card .personal-rating{font-size:.85rem;padding:4px 6px}
}


body.indetail main{display:none}body.indetail header>.bar:not(.brandbar),body.indetail header>#filters{display:none!important}body.indetail .topbar{display:none!important}
a.card{color:inherit;text-decoration:none}
#detail{max-width:1100px;margin:0 auto;padding:0 14px 50px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:10px 0;display:flex;gap:8px;align-items:center}
.hero{position:relative;margin:0 -14px;padding:26px 14px 18px;background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 62%,transparent),var(--bg) 96%),var(--bd) center top/cover no-repeat}
.hero-in{display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap}
.dposter{width:220px;max-width:42vw;border-radius:10px;box-shadow:var(--shadow);aspect-ratio:2/3;object-fit:cover;background:var(--panel)}
.dinfo{flex:1 1 320px;min-width:0}
.dinfo h1{font:600 clamp(1.6rem,4vw,2.5rem)/1.1 Georgia,serif;margin:0 0 4px}
.orig{color:var(--mute);margin:0 0 6px}.tag{font-style:italic;color:var(--mute);margin:0 0 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:2px 10px;font-size:.82rem}
.scorebox{display:flex;flex-wrap:wrap;align-items:center;gap:14px 26px;width:fit-content;max-width:100%;margin-top:14px;padding:12px 18px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.score{display:flex;align-items:center;gap:12px;min-width:0}
.score-badge{flex:none;min-width:62px;padding:8px 12px;border-radius:12px;color:#fff;font-weight:700;font-size:1.7rem;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.score-badge small{margin-left:1px;font-size:.5em;font-weight:600;opacity:.82}
.score-badge.rg{background:#1e7a3c}.score-badge.ro{background:#b45309}.score-badge.rr{background:#c62828}.score-badge.empty{background:var(--mute)}
.score-pill{flex:none;padding:5px 11px;border:1.5px solid var(--line);border-radius:10px;font-size:1.05rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.score-pill small{margin-left:1px;font-size:.65em;font-weight:600;color:var(--mute)}
.score-text{display:flex;flex-direction:column;gap:3px;min-width:0}
.score-label{font-size:.78rem;font-weight:600;letter-spacing:.03em;color:var(--mute)}
.score-sub{display:inline-flex;align-items:center;gap:6px;font-size:.92rem;color:var(--ink)}
.score-sub svg{width:15px;height:15px;flex:none;color:var(--mute)}
.scorebox{align-items:stretch;gap:16px 22px}
.personal-editor{display:flex;align-items:center;min-width:0;margin-left:auto}
.personal-summary-empty{font-size:.88rem;color:var(--mute)}
.scorebox[data-edit-personal]{cursor:pointer;border-radius:5px;transition:background .15s ease}
.scorebox[data-edit-personal]:hover{background:color-mix(in srgb,var(--ink) 3%,transparent)}
.scorebox[data-edit-personal]:focus-visible{outline:2px solid var(--acc);outline-offset:4px}
.personal-dialog{width:min(440px,calc(100vw - 32px));max-width:none;padding:0;border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.personal-dialog::backdrop{background:rgba(0,0,0,.48);backdrop-filter:blur(2px)}
.personal-dialog-inner{padding:20px}
#detail .personal-dialog-title{margin:0 0 18px;font:600 1.3rem Georgia,serif}
.personal-dialog-fields{display:flex;gap:14px;flex-wrap:wrap}
.personal-dialog-fields .personal-field{flex:1 1 130px}
.personal-dialog-fields .personal-field select,.personal-dialog-fields .personal-field input{width:100%;height:42px}
.personal-dialog-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:22px}
.personal-dialog-actions .btn{min-height:40px}
.personal-dialog-error{min-height:1.2em;margin:10px 0 0;color:#c62828;font-size:.82rem}
@media(max-width:620px){.scorebox{width:100%;gap:14px}.personal-editor{margin-left:auto}.personal-dialog-inner{padding:18px}.personal-dialog-fields{display:grid;grid-template-columns:1fr 1fr}}

#detail h2{font:600 1.25rem Georgia,serif;margin:28px 0 10px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}
dl.kv dt{color:var(--mute)}dl.kv dd{margin:0}
.strip{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.pcard{position:relative;flex:0 0 110px;font-size:.8rem;color:inherit;text-decoration:none}
.pcard .badge.tmdb{top:6px;left:6px;right:auto}
.pcard img,.pcard .ph{width:110px;aspect-ratio:2/3;object-fit:cover;border-radius:8px;background:var(--panel);border:1px solid var(--line);display:block}
.pcard .ph.noimg{height:auto;font-size:1.1rem}
.pcard b{display:block;margin-top:4px;line-height:1.2}.pcard span{color:var(--mute);display:block}
.inlib{color:var(--acc)!important;font-size:.72rem}





.gal{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}.gal img{height:130px;border-radius:6px;display:block}
details{margin:8px 0}summary{cursor:pointer;color:var(--mute)}


#detail a{color:var(--acc)}#detail a.pcard{color:inherit}

.saga-poster{width:150px;max-width:34vw;aspect-ratio:2/3;object-fit:cover;border-radius:8px;background:var(--panel);box-shadow:var(--shadow)}

.saga-stats{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.saga-grid{display:flex;flex-direction:column;gap:0}
.saga-row{display:grid;grid-template-columns:116px minmax(0,1fr);gap:16px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.saga-row:first-child{padding-top:4px}
.saga-row .saga-cover{position:relative;width:116px;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--panel);border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.saga-row .saga-cover img{display:block;width:100%;height:100%;object-fit:cover}
.saga-row .saga-cover .noimg{height:100%;font-size:1.5rem}
.saga-row .saga-ratings{position:absolute;top:6px;left:6px;right:6px;display:flex;justify-content:space-between;gap:4px;align-items:flex-start}
.saga-row .saga-ratings .badge{position:static;display:inline-block;font-size:.75rem;padding:2px 6px}
.saga-row .saga-ratings .badge.hide{display:none}
.saga-row .poster-date{font-size:.68rem}
.saga-row .saga-info{min-width:0;padding:2px 0}
.saga-row h3{font-size:1.08rem;line-height:1.25;margin:0 0 5px}
.saga-row .saga-release{font-size:.82rem;color:var(--mute);margin-bottom:9px}
.saga-row .saga-overview{margin:0;font-size:.9rem;line-height:1.5;white-space:pre-line;color:var(--ink)}
.saga-row:hover h3{text-decoration:underline}
@media (max-width:520px){.saga-row{grid-template-columns:92px minmax(0,1fr);gap:12px;padding:12px 0}.saga-row .saga-cover{width:92px}.saga-row h3{font-size:1rem}.saga-row .saga-overview{font-size:.84rem;line-height:1.4}}


#stats{max-width:1100px;margin:0 auto;padding:0 14px 50px}
#stats h1{font:600 clamp(1.6rem,4vw,2.2rem)/1.1 Georgia,serif;margin:6px 0 4px}
#stats h2{font:600 1.2rem Georgia,serif;margin:30px 0 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi b{display:block;font:600 1.6rem/1.1 Georgia,serif}.kpi span{color:var(--mute);font-size:.82rem}
.tabs{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.vb{display:flex;align-items:flex-end;gap:6px;height:230px;box-sizing:border-box;overflow-x:auto;padding-top:18px}
.vcol{flex:1 0 34px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:.75rem}
.vcol .vv{color:var(--mute);margin-bottom:2px}.vcol .vbar{display:block;flex:none;width:100%;max-width:46px;border-radius:4px 4px 0 0;min-height:2px;background:var(--acc);margin:0}
.vcol .vl{margin-top:4px;color:var(--mute);white-space:nowrap}
.c-g{background:#1e7a3c!important}.c-o{background:#b45309!important}.c-r{background:#c62828!important}
.hrow{display:grid;grid-template-columns:minmax(90px,200px) 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:4px 0;cursor:pointer;color:inherit;font:inherit}
.hrow:hover .hl{text-decoration:underline}.hrow.static{cursor:default}.hrow.static:hover .hl{text-decoration:none}
.hl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb{height:12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}.hb i{display:block;height:100%;background:var(--acc)}
.hv{font-variant-numeric:tabular-nums;min-width:74px;text-align:right}.hv small{color:var(--mute)}
.two-col{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px}

.reclist{list-style:none;padding:0;margin:0}.reclist li{padding:5px 0;border-bottom:1px solid var(--line)}
#stats code{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:.85em}
#tmdbSearchStatus{margin:8px 0 14px}#tmdbSearchStatus.bad{color:#c62828}#tmdbSearchStatus.good{color:#1e7a3c}
#tmdbSearchResults{display:grid;gap:10px;margin:12px 0}
.tmdb-result{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit;text-align:left;cursor:pointer}.tmdb-result:hover{border-color:var(--acc)}
.tmdb-result img{width:64px;aspect-ratio:2/3;object-fit:cover;border-radius:6px;background:var(--bg)}
.tmdb-result p{margin:4px 0 8px;font-size:.84rem;color:var(--mute)}
.tmdb-result small{color:var(--acc);font-weight:650}
#tmdbMissingAlert{margin:12px auto 18px;max-width:1100px;padding:13px 16px;border:1px solid #e5a000;border-radius:12px;background:#fff4d6;color:#5c4100;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}#tmdbMissingAlert[hidden]{display:none}#tmdbMissingAlert a{font-weight:700;color:inherit;text-decoration:underline}
/* Sobriété : accent rouge rare, badges discrets, liens neutres */
:root{--mute2:#a8a398}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--mute:#a8a398}}

.icon-btn{border-color:transparent;background:transparent}
.head-actions .icon-btn svg{width:26px!important;height:26px!important;min-width:26px;min-height:26px}
#q{min-height:40px;padding:8px 15px}

.card .poster-personal-rating{font-size:.82rem;top:8px;right:8px}

.poster .badge.ro,.card .poster-personal-rating.ro{border-left-color:#d98a2b}
.poster .badge.rr,.card .poster-personal-rating.rr{border-left-color:#d9534f}
.card h2{font-family:Georgia,"Times New Roman",serif;font-weight:600}
.watched-date{color:var(--mute);font-weight:500;font-size:.78rem}
.watched-date span{color:var(--mute);font-size:.9rem;opacity:.7}
.score-badge.rg{background:#24613b}.score-badge.ro{background:#8a4a10}.score-badge.rr{background:#9a2a27}

/* Structure de l’en-tête et navigation secondaire */
header{display:block;padding:8px 14px;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar{min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;background:var(--bg);border-bottom:1px solid var(--line);margin:0 -14px}
header .bar{width:100%;margin:0}
.topbar #back{font:600 1.5rem/1.1 Georgia,"Times New Roman",serif;letter-spacing:-.01em;margin:0;color:var(--ink);background:transparent;border:0;padding:6px 0;cursor:pointer}
.home-controls .sort-direction{font-size:1.3rem;font-weight:500}
/* Bloc des notes (fiche) : sobre, sans cadre */
.scorebox{width:100%;background:transparent;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0;box-shadow:none;padding:16px 0;gap:14px 32px;align-items:center}
.scorebox .score-badge{background:transparent!important;color:var(--ink);padding:0 0 2px;min-width:0;border-radius:0;font:600 2.2rem/1 Georgia,serif;border-bottom:2px solid var(--mute)}
.scorebox .score-badge.rg{border-bottom-color:#3fae66}.scorebox .score-badge.ro{border-bottom-color:#d98a2b}.scorebox .score-badge.rr{border-bottom-color:#d9534f}
.scorebox .score-badge small{font:500 .45em system-ui,sans-serif;color:var(--mute);opacity:1}
.scorebox .score-pill{border:0;padding:0;font:500 1.5rem/1 Georgia,serif;color:var(--mute)}
.scorebox .score-label{text-transform:uppercase;letter-spacing:.08em;font-size:.7rem}
.personal-editor{margin-left:auto}
.personal-edit-button:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.film-source-links{display:flex;align-items:center;gap:7px;margin:7px 0 2px}.film-source-icon{display:inline-flex;align-items:center;justify-content:center;width:32px;height:27px;border-radius:6px;text-decoration:none!important;transition:transform .15s ease,opacity .15s ease}.film-source-icon:hover{transform:translateY(-1px);opacity:.82}.film-source-icon:focus-visible{outline:2px solid var(--acc);outline-offset:3px}.tmdb-source{background:#01b4e4;color:#fff!important;font-size:10px;font-weight:900;letter-spacing:-.5px}.sc-source{background:#e74b4b;color:#fff!important;font-size:13px;font-weight:850;letter-spacing:-.7px}

/* Fiche : méta en texte, genres légers, sources discrètes, affiche compacte */
.dinfo{display:flex;flex-direction:column}
.dinfo>*{order:70}.dinfo h1{order:10}.dinfo .orig{order:20}.dinfo .tag{order:30}.dinfo .meta-line{order:40}.dinfo .chips{order:50}.dinfo .film-source-links{order:60}
.meta-line{margin:4px 0 6px;color:var(--mute);font-size:.95rem;letter-spacing:.01em}
.film-source-links{gap:8px;margin:8px 0 0}
.hero-in>.scorebox{flex:0 0 100%}
@media(max-width:620px){
 .hero-in{flex-wrap:wrap;gap:14px 16px;align-items:flex-end}
 .dposter{flex:none;width:34%;max-width:150px}
 .dinfo{flex:1 1 0;min-width:0}
 .dinfo h1{font-size:clamp(1.35rem,6vw,1.8rem)}
 .film-source-links{margin-top:6px}
}

/* Tags légers, sources colorées, note mise en avant */
:root{--r-good:#1e8a4c;--r-mid:#b86a0c;--r-bad:#c62828}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--r-good:#4ccf84;--r-mid:#ff9a1f;--r-bad:#ff4538}}
:root[data-theme="dark"]{--r-good:#4ccf84;--r-mid:#ff9a1f;--r-bad:#ff4538}
.meta-line{font-size:.98rem}
#detail a.genre-link:not(.pcard):not(.btn):not(.inlib){color:var(--mute);border-bottom:1px solid transparent}
#detail a.genre-link:not(.pcard):not(.btn):not(.inlib):hover{color:var(--ink);border-bottom-color:var(--mute)}
#detail .chips .chip{border:0;border-radius:4px;padding:2px 8px;background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--mute);font-size:.8rem}
#detail a.chip:hover{color:var(--ink)}
.scorebox .score-badge{font-size:2.7rem;border-bottom-width:3px;color:var(--ink)}
.scorebox .score-badge.rg{color:var(--r-good);border-bottom-color:var(--r-good)}
.scorebox .score-badge.ro{color:var(--r-mid);border-bottom-color:var(--r-mid)}
.scorebox .score-badge.rr{color:var(--r-bad);border-bottom-color:var(--r-bad)}
.scorebox .score-badge small{font-size:.38em}
.scorebox .score:first-child .score-sub{font-size:.9rem;font-weight:500;color:var(--ink)}

/* Accueil : note en couleur */
.poster .badge.rg,.card .poster-personal-rating.rg{--lvl:#4ccf84}
.poster .badge.ro,.card .poster-personal-rating.ro{--lvl:#ff9a1f}
.poster .badge.rr,.card .poster-personal-rating.rr{--lvl:#ff4538}
.poster .badge.rg,.poster .badge.ro,.poster .badge.rr,.card .poster-personal-rating.rg,.card .poster-personal-rating.ro,.card .poster-personal-rating.rr{background:color-mix(in srgb,var(--lvl) 30%,rgba(12,14,18,.72))!important;color:var(--lvl);border-left:4px solid var(--lvl);font-weight:700;font-size:.95rem}
.poster .badge small,.card .poster-personal-rating small{color:#fff;opacity:.75;font-weight:500}

/* Accueil : date lisible + repères par mois (tri « Vu le ») */
.watched-date{color:var(--ink);font-weight:500;font-size:.82rem}
.month-sep{grid-column:1/-1;display:flex;align-items:center;gap:12px;margin:12px 0 0;font:600 1.1rem/1.2 Georgia,"Times New Roman",serif;color:var(--ink)}
.month-sep::after{content:"";flex:1;height:1px;background:var(--line)}
.month-sep:first-child{margin-top:0}

/* Accueil : notes plus grandes, date sur l'affiche */
.poster .badge.rg,.poster .badge.ro,.poster .badge.rr,.card .poster-personal-rating.rg,.card .poster-personal-rating.ro,.card .poster-personal-rating.rr{font-size:1.3rem;padding:4px 10px 5px;line-height:1.1;top:8px;right:8px;border-left-width:5px}
.poster .badge small,.card .poster-personal-rating small{font-size:.55em}
.poster-date{padding:26px 9px 8px;font-size:.78rem;font-weight:600;letter-spacing:.01em;background:linear-gradient(transparent,rgba(0,0,0,.82))}

.poster-date{display:flex;align-items:center;gap:6px;padding:40px 9px 9px;background:linear-gradient(to bottom,transparent,rgba(0,0,0,.6) 38%,rgba(0,0,0,.92));text-shadow:0 1px 3px rgba(0,0,0,.9)}
.poster-date svg{flex:none;color:#a8a398;opacity:1}

/* Page saga : mêmes règles que l'accueil et la fiche */
#detail a.saga-row{color:var(--ink)}
.saga-row h3{font-family:Georgia,"Times New Roman",serif;font-weight:600}
.saga-row:hover h3{text-decoration:none}
.saga-row .saga-cover{border-radius:8px}
.saga-cover .badge{background:rgba(12,14,18,.62)!important;color:#fff;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.14);border-left-width:3px;font-weight:600;font-size:.78rem;padding:3px 7px;box-shadow:none}
.saga-cover .badge.rg{--lvl:#4ccf84}.saga-cover .badge.ro{--lvl:#ff9a1f}.saga-cover .badge.rr{--lvl:#ff4538}
.saga-cover .badge.rg,.saga-cover .badge.ro,.saga-cover .badge.rr{background:color-mix(in srgb,var(--lvl) 30%,rgba(12,14,18,.72))!important;color:var(--lvl);border-left:4px solid var(--lvl);font-weight:700;font-size:1.05rem;line-height:1.1;padding:3px 8px 4px}
.saga-row .poster-date{font-size:.7rem;padding:30px 7px 7px;gap:5px}
.saga-row .poster-date svg{width:12px;height:12px}

/* Saga : affiches à la taille de la fiche, synopsis tronqué, notes de même taille */
.saga-row{grid-template-columns:220px minmax(0,1fr);gap:20px}
.saga-row .saga-cover{width:100%}
.saga-row .saga-info{align-self:stretch;contain:size;overflow:hidden}
.saga-row .saga-overview{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:9;overflow:hidden;white-space:normal}
.saga-cover .badge.tmdb{background:rgba(12,14,18,.62)!important;color:#fff;border-left:4px solid #8a8f99;font-weight:700;font-size:1.05rem;line-height:1.1;padding:3px 8px 4px}
@media(max-width:620px){
 .saga-row{grid-template-columns:min(34%,150px) minmax(0,1fr);gap:14px 16px}
 .saga-row .saga-overview{-webkit-line-clamp:5;font-size:.88rem;line-height:1.45}
}

#discover{max-width:1400px;margin:0 auto;padding:0 14px 50px}
#discover h1{font:600 clamp(1.6rem,4vw,2.2rem)/1.1 Georgia,"Times New Roman",serif;margin:8px 0}
.discover-intro{color:var(--mute);margin:4px 0 16px}
.discover-filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.discover-field{display:flex;flex-direction:column;gap:5px;min-width:0;color:var(--mute);font-size:.82rem}
.discover-field select,.discover-field input{width:100%;min-width:0;min-height:42px}
.discover-field select[multiple]{min-height:112px;padding:6px}
.discover-field small{font-size:.74rem;color:var(--mute)}
.discover-field.wide{grid-column:1/-1}
.discover-keyword{display:flex;gap:6px}
.discover-keyword input{flex:1;min-width:0}
#discoverKeywordResults{display:grid;gap:4px;margin-top:5px}
.discover-keyword-result{padding:7px 9px;text-align:left;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);cursor:pointer}
#discoverKeywords{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.discover-keyword-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 8px;font-size:.78rem;color:var(--ink)}
.discover-keyword-chip button{border:0;background:transparent;color:var(--mute);padding:0;cursor:pointer;font-size:1rem}
.discover-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}
@media(max-width:520px){#discover{padding:0 12px 50px}.discover-filters{grid-template-columns:1fr}.discover-field.wide{grid-column:auto}.discover-actions{display:grid;grid-template-columns:1fr 1fr}.discover-actions #discoverHideWatched{grid-column:1/-1}.discover-keyword{align-items:stretch}.discover-keyword .btn{padding:8px 10px;font-size:.88rem}}
#discoverGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 14px}
#discoverStatus{padding:12px 0;color:var(--mute)}
#discoverStatus.bad{color:#c62828}
#discoverMore{display:block;margin:24px auto 0}
.discover-library{font-size:.76rem;color:var(--acc);font-weight:650}
@media(max-width:520px){#discover{padding:0 12px 50px}#discoverGrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 11px}.discover-filters{grid-template-columns:1fr 1fr;gap:10px}.discover-field.wide{grid-column:1/-1}.discover-field select[multiple]{min-height:130px}.discover-actions .btn{flex:1}}


#kodiPage{max-width:1100px;margin:0 auto;padding:0 14px 50px}
#kodiPage h1{font:600 clamp(1.6rem,4vw,2.2rem)/1.1 Georgia,serif;margin:6px 0 4px}
.kodi-page-summary{margin:6px 0 18px}
.kodi-page-controls{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,220px) 46px;gap:8px;align-items:center;margin:14px 0 4px}
.kodi-page-controls input,.kodi-page-controls select{width:100%;min-height:42px}
.kodi-page-count{margin:8px 0 12px}
#kodiGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 14px}
@media(max-width:520px){.kodi-page-controls{grid-template-columns:minmax(0,1fr) 46px}.kodi-page-controls input{grid-column:1/-1}.kodi-page-controls select{grid-column:1}.kodi-page-controls .sort-direction{grid-column:2;grid-row:2}#kodiGrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 11px}}
.kodi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 14px;margin-top:18px}
.kodi-card{min-width:0;color:inherit;text-decoration:none;display:flex;flex-direction:column;gap:3px}
.kodi-card .poster{position:relative;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--panel);border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.kodi-card .poster img{width:100%;height:100%;object-fit:cover;display:block}
.kodi-card h2{font:600 .95rem/1.25 Georgia,serif;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kodi-card .meta{font-size:.8rem;line-height:1.25;color:var(--mute)}.kodi-card .kodi-filename{font-size:.76rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.82}
.kodi-card:hover h2{text-decoration:underline;text-underline-offset:3px}
@media(max-width:520px){.kodi-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 11px}.kodi-card h2{font-size:.91rem}.kodi-card .meta{font-size:.75rem}}
</style>

<body>
<div id="tmdbMissingAlert" role="alert" aria-live="assertive" hidden><span><strong>Jeton TMDB manquant.</strong> La recherche et l’ajout de films nécessitent un jeton TMDB.</span><a href="./tools.html">Configurer dans Outils → Jeton TMDB</a></div>

<header>
  <div class="bar brandbar">
    <h1 class="brand-title"><a href="./" aria-label="Accueil Ma vidéothèque">Ma vidéothèque</a></h1><div class="head-actions"><a class="icon-btn" href="./#kodi" aria-label="Films présents sur Kodi" title="Films présents sur Kodi"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="13" rx="2"/><path d="M8 22h8M12 18v4M7 9h10v5H7z"/></svg></a><a class="icon-btn" href="./#discover" aria-label="Découvrir" title="Découvrir"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2.2 4.8-4.8 2.2 2.2-4.8 4.8-2.2Z"/></svg></a><a class="icon-btn" href="./#stats" aria-label="Statistiques" title="Statistiques"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20v-8M12 20V5M19 20v-5"/></svg></a><a class="icon-btn" href="tools.html" aria-label="Paramètres et outils" title="Paramètres et outils"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></a></div>
  </div>
  <div class="bar"><input id="q" type="search" placeholder="Rechercher un film sur TMDB…" aria-label="Rechercher un film sur TMDB"></div>
  <div class="bar home-controls">
    <button id="fbtn" class="btn alt" type="button" aria-expanded="false"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>Filtres</button>
    <select id="sort" aria-label="Trier par">
      <option value="w">Tri : Vu le</option><option value="r">Tri : Note</option>
      <option value="t">Tri : Titre</option><option value="m">Tri : Durée</option>
    </select>
    <button id="dirb" class="btn alt sort-direction" type="button" aria-label="Inverser l’ordre du tri">↓</button>
  </div>
  <div id="filters" class="hide">
    <label>Note<span class="two"><input id="rmin" type="number" min="0" max="10" step="0.5" placeholder="min"><input id="rmax" type="number" min="0" max="10" step="0.5" placeholder="max"></span></label>
    <label>Durée (minutes)<span class="two"><input id="mmin" type="number" min="0" placeholder="min"><input id="mmax" type="number" min="0" placeholder="max"></span></label>
    <label>Vu entre<span class="two"><input id="dfrom" type="date"><input id="dto" type="date"></span></label>
    <input id="dsel" type="hidden">
    <label>Genre<select id="gsel"><option value="">Tous</option></select></label>
    <button id="reset" class="btn alt" type="button">Réinitialiser</button>
  </div>
</header>

<main>
  <div id="status">Chargement…</div>
  <div id="tmdbSearchStatus" class="mute" role="status" aria-live="polite"></div>
  <div id="tmdbSearchResults" class="hide"></div>
  <div id="grid"></div>
  <button id="more" class="btn alt hide" type="button">Afficher plus</button>
</main>
<section id="detail" class="hide" aria-live="polite"></section>
<section id="stats" class="hide"></section>
<section id="discover" class="hide" aria-live="polite"></section>
<section id="kodiPage" class="hide" aria-live="polite"></section>
