<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https://image.tmdb.org; connect-src 'self' https://api.themoviedb.org; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; base-uri 'self'; object-src 'none'; form-action 'self'">
<meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet">
<title>Accueil</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%9E%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="./css/app.css">
<link rel="stylesheet" href="./header.css">
</head>
<body>
<div id="tmdbMissingAlert" role="alert" aria-live="assertive" hidden><span><strong>Jeton TMDB manquant.</strong> La recherche et l’ajout de films nécessitent un jeton TMDB.</span><a href="./tools.html">Configurer dans Outils → Jeton TMDB</a></div>

<header>
  <div class="bar brandbar">
    <h1 class="brand-title"><a href="./" aria-label="Accueil Ma vidéothèque">Ma vidéothèque</a></h1><div class="head-actions"><a class="icon-btn" href="./#kodi" aria-label="Films présents sur Kodi" title="Films présents sur Kodi"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="13" rx="2"/><path d="M8 22h8M12 18v4M7 9h10v5H7z"/></svg></a><a class="icon-btn" href="./#discover" aria-label="Découvrir" title="Découvrir"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2.2 4.8-4.8 2.2 2.2-4.8 4.8-2.2Z"/></svg></a><a class="icon-btn" href="./#stats" aria-label="Statistiques" title="Statistiques"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20v-8M12 20V5M19 20v-5"/></svg></a><a class="icon-btn" href="tools.html" aria-label="Paramètres et outils" title="Paramètres et outils"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></a></div>
  </div>
  <div class="bar"><input id="q" type="search" placeholder="Rechercher un film sur TMDB…" aria-label="Rechercher un film sur TMDB"></div>
  <div class="bar home-controls">
    <button id="fbtn" class="btn alt" type="button" aria-expanded="false"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>Filtres</button>
    <select id="sort" aria-label="Trier par">
      <option value="w">Tri : Vu le</option><option value="r">Tri : Note</option>
      <option value="t">Tri : Titre</option><option value="m">Tri : Durée</option>
    </select>
    <button id="dirb" class="btn alt sort-direction" type="button" aria-label="Inverser l’ordre du tri">↓</button>
  </div>
  <div id="filters" class="hide">
    <label>Note<span class="two"><input id="rmin" type="number" min="0" max="10" step="0.5" placeholder="min"><input id="rmax" type="number" min="0" max="10" step="0.5" placeholder="max"></span></label>
    <label>Durée (minutes)<span class="two"><input id="mmin" type="number" min="0" placeholder="min"><input id="mmax" type="number" min="0" placeholder="max"></span></label>
    <label>Vu entre<span class="two"><input id="dfrom" type="date"><input id="dto" type="date"></span></label>
    <input id="dsel" type="hidden">
    <label>Genre<select id="gsel"><option value="">Tous</option></select></label>
    <button id="reset" class="btn alt" type="button">Réinitialiser</button>
  </div>
</header>

<main>
  <div id="status">Chargement…</div>
  <div id="tmdbSearchStatus" class="mute" role="status" aria-live="polite"></div>
  <div id="tmdbSearchResults" class="hide"></div>
  <div id="grid"></div>
  <button id="more" class="btn alt hide" type="button">Afficher plus</button>
</main>
<section id="detail" class="hide" aria-live="polite"></section>
<section id="stats" class="hide"></section>
<section id="discover" class="hide" aria-live="polite"></section>
<section id="kodiPage" class="hide" aria-live="polite"></section>

<script src="mavideotheque-db.js?v=20261115-settings2"></script>
<script src="./js/common.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
